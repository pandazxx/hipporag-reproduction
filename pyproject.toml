[project]
name = "hipporag-reproduction"
version = "0.1.0"
description = "Reproduction of HippoRAG (NeurIPS 2024) for agent memory research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # HippoRAG legacy has no setup.py/pyproject.toml — clone it manually:
    #   git clone -b legacy https://github.com/OSU-NLP-Group/HippoRAG vendor/hipporag
    # then run: PYTHONPATH=vendor/hipporag uv run python experiments/demo.py
    "openai<1.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "tiktoken>=0.5",
    "tqdm>=4.65",
    "langchain-nvidia-ai-endpoints>=0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
